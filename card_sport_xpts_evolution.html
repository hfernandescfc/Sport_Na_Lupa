<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Sport Recife — xPts por Rodada</title>
<style>
  :root {
    --bg: #0D0D0D;
    --yellow: #E8B800;
    --text-primary: #F0F0F0;
    --text-secondary: #9A9A9A;
    --border: #2A2A2A;
    --win: #27AE60;
    --draw: #E8B800;
    --loss: #C0392B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    width: 1080px; height: 1080px;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text-primary);
  }
  .card {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    padding: 28px 40px 18px;
  }
  .header { text-align: center; margin-bottom: 10px; }
  .header h1 {
    font-size: 28px; font-weight: 900;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--yellow);
  }
  .header .meta {
    font-size: 14px; color: var(--text-secondary);
    margin-top: 6px; letter-spacing: 0.02em;
  }
  .header .meta span { margin: 0 6px; opacity: 0.4; }
  .chart-area { flex: 1; position: relative; }
  svg.plot { width: 100%; height: 100%; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 10px; border-top: 1px solid var(--border); margin-top: 6px;
  }
  .footer-left { display: flex; align-items: center; gap: 10px; }
  .footer-logo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
  .footer-handle { font-size: 13px; font-weight: 600; color: #666; }
  .footer-source { font-size: 12px; color: #555; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Sport Recife · xPts por Rodada · Série B 2026</h1>
    <div class="meta">
      Barras = xPts obtido por jogo
      <span>·</span>
      Linhas = acumulado
      <span>·</span>
      #N = rank do adversário em xPts
    </div>
  </div>

  <div class="chart-area">
    <svg class="plot" id="plot" viewBox="0 0 1000 870" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="footer">
    <div class="footer-left">
      <img class="footer-logo" src="__AVATAR_SRC__" alt="SportRecifeLab">
      <div class="footer-handle">@SportRecifeLab</div>
    </div>
    <div class="footer-source">Dados: SofaScore</div>
  </div>
</div>

<script>
// ============================================================
// [VAR] DADOS — substituídos pelo script Python
// ============================================================
const rounds = [
  { round:1, opp:'Cuiabá',  rank:11, isHome:false, sportScore:0, oppScore:0, result:'E', pts:1, xpts:1.10, oppLogo:'', cumPts:1,  cumXpts:1.10 },
];
const sportLogo = '__SPORT_LOGO__';
const maxRound  = 7;

// ============================================================
// LAYOUT
// ============================================================
const VW = 1000, VH = 870;

// Bar section
const BAR_PAD_L = 48, BAR_PAD_R = 20;
const BAR_TOP = 10, BAR_BOTTOM = 450;
const LOGO_Y  = 60;           // center Y of opponent logo
const RANK_Y  = 115;          // center Y of rank badge
const BAR_BASE= 390;          // Y of bar baseline
const BAR_MAX_H = 220;        // px for xPts = 3.0
const SCORE_Y = 412;          // result+score text
const ROUND_Y = 438;          // round label

// Accum section
const ACC_TOP    = 490;
const ACC_BOTTOM = 845;
const ACC_PAD_L  = 48, ACC_PAD_R = 20;
const ACC_Y_MAX  = Math.ceil(rounds[rounds.length-1].cumXpts / 5 + 1) * 5 || 20;

const N = rounds.length;
const COL_W = (VW - BAR_PAD_L - BAR_PAD_R) / N;

function colCX(i) { return BAR_PAD_L + i * COL_W + COL_W / 2; }

function accX(i)  { return ACC_PAD_L + i * ((VW - ACC_PAD_L - ACC_PAD_R) / (N - 1)); }
function accY(v)  { return ACC_TOP + (1 - v / ACC_Y_MAX) * (ACC_BOTTOM - ACC_TOP); }

const svg = document.getElementById('plot');
const ns  = 'http://www.w3.org/2000/svg';

function el(tag, attrs, text) {
  const e = document.createElementNS(ns, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function resultColor(r) {
  if (r === 'V') return '#27AE60';
  if (r === 'D') return '#C0392B';
  return '#C8A000';
}

function rankColor(rank) {
  if (rank <= 7)  return '#27AE60';   // forte: verde (calendário difícil)
  if (rank <= 13) return '#9A9A9A';   // médio: cinza
  return '#C0392B';                   // fraco: vermelho (calendário fácil)
}

// ---- SECTION DIVIDER ----
svg.appendChild(el('line', {
  x1: BAR_PAD_L, x2: VW - BAR_PAD_R,
  y1: ACC_TOP - 18, y2: ACC_TOP - 18,
  stroke: '#222', 'stroke-width': '1'
}));

// ---- BARS SECTION ----

// Y axis (per-game xPts)
[0, 1, 2, 3].forEach(v => {
  const y = BAR_BASE - (v / 3) * BAR_MAX_H;
  svg.appendChild(el('line', {
    x1: BAR_PAD_L - 4, x2: VW - BAR_PAD_R,
    y1: y, y2: y,
    stroke: v === 0 ? '#333' : '#1C1C1C', 'stroke-width': v === 0 ? '1' : '1'
  }));
  svg.appendChild(el('text', {
    x: BAR_PAD_L - 8, y: y + 4,
    fill: '#555', 'font-size': '11', 'text-anchor': 'end',
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif',
    'font-variant-numeric': 'tabular-nums'
  }, v.toFixed(0)));
});

// Y axis label (bar section)
{
  const lbl = el('text', {
    x: 12, y: BAR_BASE - BAR_MAX_H / 2,
    fill: '#666', 'font-size': '11',
    'text-anchor': 'middle',
    transform: `rotate(-90, 12, ${BAR_BASE - BAR_MAX_H / 2})`,
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
  }, 'xPts / jogo');
  svg.appendChild(lbl);
}

// Bars + logos + labels
rounds.forEach((r, i) => {
  const cx   = colCX(i);
  const bw   = Math.min(COL_W * 0.55, 72);
  const bh   = (r.xpts / 3) * BAR_MAX_H;
  const bx   = cx - bw / 2;
  const by   = BAR_BASE - bh;
  const col  = resultColor(r.result);

  // Bar background (subtle)
  svg.appendChild(el('rect', {
    x: bx, y: BAR_BASE - BAR_MAX_H,
    width: bw, height: BAR_MAX_H,
    fill: '#141414', rx: '3'
  }));

  // Bar fill
  svg.appendChild(el('rect', {
    x: bx, y: by,
    width: bw, height: bh,
    fill: col, opacity: '0.85', rx: '3'
  }));

  // xPts value inside bar (if tall enough)
  if (bh > 28) {
    svg.appendChild(el('text', {
      x: cx, y: by + 20,
      fill: '#fff', 'font-size': '14', 'font-weight': '800',
      'text-anchor': 'middle',
      'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
    }, r.xpts.toFixed(2)));
  } else {
    // Value above bar
    svg.appendChild(el('text', {
      x: cx, y: by - 7,
      fill: col, 'font-size': '14', 'font-weight': '800',
      'text-anchor': 'middle',
      'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
    }, r.xpts.toFixed(2)));
  }

  // Opponent logo
  if (r.oppLogo) {
    svg.appendChild(el('image', {
      x: cx - 26, y: LOGO_Y - 26,
      width: 52, height: 52,
      href: r.oppLogo
    }));
  }

  // Rank badge — maior e mais visível
  {
    const rc = rankColor(r.rank);
    svg.appendChild(el('rect', {
      x: cx - 22, y: RANK_Y - 12,
      width: 44, height: 22, rx: '5',
      fill: rc, opacity: '0.18'
    }));
    svg.appendChild(el('rect', {
      x: cx - 22, y: RANK_Y - 12,
      width: 44, height: 22, rx: '5',
      fill: 'none', stroke: rc, 'stroke-width': '1', opacity: '0.5'
    }));
    svg.appendChild(el('text', {
      x: cx, y: RANK_Y + 5,
      fill: rc, 'font-size': '13', 'font-weight': '800',
      'text-anchor': 'middle',
      'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
    }, `#${r.rank}`));
  }

  // Result + score — maior
  {
    const rc = resultColor(r.result);
    svg.appendChild(el('text', {
      x: cx, y: SCORE_Y,
      fill: rc, 'font-size': '15', 'font-weight': '800',
      'text-anchor': 'middle',
      'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
    }, `${r.result} ${r.sportScore}-${r.oppScore}`));
  }

  // Round label
  svg.appendChild(el('text', {
    x: cx, y: ROUND_Y,
    fill: '#777', 'font-size': '13', 'font-weight': '600',
    'text-anchor': 'middle',
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
  }, `R${r.round}`));

  // Home/Away indicator
  svg.appendChild(el('text', {
    x: cx, y: ROUND_Y + 16,
    fill: '#444', 'font-size': '10',
    'text-anchor': 'middle',
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
  }, r.isHome ? 'CASA' : 'FORA'));
});

// ---- ACCUMULATED SECTION ----

// Section title
svg.appendChild(el('text', {
  x: BAR_PAD_L, y: ACC_TOP - 24,
  fill: '#555', 'font-size': '11', 'font-style': 'italic',
  'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
}, 'Acumulado por rodada'));

// Y grid + labels
const yTicks = [];
for (let v = 0; v <= ACC_Y_MAX; v += 5) yTicks.push(v);
yTicks.forEach(v => {
  const y = accY(v);
  svg.appendChild(el('line', {
    x1: ACC_PAD_L, x2: VW - ACC_PAD_R,
    y1: y, y2: y,
    stroke: v === 0 ? '#333' : '#1A1A1A', 'stroke-width': '1'
  }));
  svg.appendChild(el('text', {
    x: ACC_PAD_L - 8, y: y + 4,
    fill: '#555', 'font-size': '11', 'text-anchor': 'end',
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif',
    'font-variant-numeric': 'tabular-nums'
  }, v.toFixed(0)));
});

// Y axis label (accum section)
{
  const midY = (ACC_TOP + ACC_BOTTOM) / 2;
  svg.appendChild(el('text', {
    x: 12, y: midY,
    fill: '#666', 'font-size': '11', 'text-anchor': 'middle',
    transform: `rotate(-90, 12, ${midY})`,
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
  }, 'Pts acum.'));
}

// Lines — xPts accum (yellow) and pts accum (white)
function buildPath(points) {
  return points.map((p,i) => `${i===0?'M':'L'}${p[0]},${p[1]}`).join(' ');
}

if (N > 0) {
  const xptsPoints = rounds.map((r,i) => [accX(i), accY(r.cumXpts)]);
  const ptsPoints  = rounds.map((r,i) => [accX(i), accY(r.cumPts)]);

  // xPts area fill
  const areaPath = `${buildPath(xptsPoints)} L${accX(N-1)},${accY(0)} L${accX(0)},${accY(0)} Z`;
  svg.appendChild(el('path', {
    d: areaPath, fill: '#E8B800', opacity: '0.06'
  }));

  // xPts line
  svg.appendChild(el('path', {
    d: buildPath(xptsPoints),
    fill: 'none', stroke: '#E8B800', 'stroke-width': '3.5',
    'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }));

  // Pts line (dashed white)
  svg.appendChild(el('path', {
    d: buildPath(ptsPoints),
    fill: 'none', stroke: '#E0E0E0', 'stroke-width': '2.5',
    'stroke-dasharray': '7,5',
    'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }));

  // Dots + values
  rounds.forEach((r, i) => {
    const xp = accX(i), yxp = accY(r.cumXpts), yp = accY(r.cumPts);
    const overlap = Math.abs(yxp - yp) < 16;

    // xPts dot
    svg.appendChild(el('circle', { cx: xp, cy: yxp, r: '6', fill: '#E8B800' }));
    svg.appendChild(el('text', {
      x: xp, y: yxp - 10,
      fill: '#E8B800', 'font-size': '12', 'font-weight': '700',
      'text-anchor': 'middle',
      'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
    }, r.cumXpts.toFixed(1)));

    // Pts dot
    svg.appendChild(el('circle', { cx: xp, cy: yp, r: '5', fill: '#E0E0E0' }));
    svg.appendChild(el('text', {
      x: xp, y: yp + (overlap ? 22 : 20),
      fill: '#E0E0E0', 'font-size': '12',
      'text-anchor': 'middle',
      'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
    }, r.cumPts.toFixed(0)));
  });

  // End-of-line labels
  const lastI = N - 1;
  svg.appendChild(el('text', {
    x: accX(lastI) + 6, y: accY(rounds[lastI].cumXpts) + 4,
    fill: '#E8B800', 'font-size': '11', 'font-weight': '700',
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
  }, 'xPts'));
  svg.appendChild(el('text', {
    x: accX(lastI) + 6, y: accY(rounds[lastI].cumPts) + 4,
    fill: '#D0D0D0', 'font-size': '11',
    'font-family': 'Helvetica Neue, Helvetica, Arial, sans-serif'
  }, 'Pts'));

  // Legend
  const lx = VW - ACC_PAD_R - 160, ly = ACC_BOTTOM - 40;
  svg.appendChild(el('line', { x1:lx, x2:lx+24, y1:ly, y2:ly, stroke:'#E8B800', 'stroke-width':'2.5' }));
  svg.appendChild(el('text', { x:lx+30, y:ly+4, fill:'#E8B800', 'font-size':'11', 'font-family':'Helvetica Neue, Helvetica, Arial, sans-serif' }, 'xPts acumulado'));
  svg.appendChild(el('line', { x1:lx, x2:lx+24, y1:ly+16, y2:ly+16, stroke:'#D0D0D0', 'stroke-width':'2', 'stroke-dasharray':'6,4' }));
  svg.appendChild(el('text', { x:lx+30, y:ly+20, fill:'#D0D0D0', 'font-size':'11', 'font-family':'Helvetica Neue, Helvetica, Arial, sans-serif' }, 'Pontos reais'));
}

// ---- SPORT LOGO (top-left header area, small) ----
if (sportLogo && sportLogo !== '__SPORT_LOGO__') {
  const img = el('image', { x: BAR_PAD_L, y: 8, width: 36, height: 36, href: sportLogo, opacity: '0.7' });
  svg.appendChild(img);
}
</script>
</body>
</html>
